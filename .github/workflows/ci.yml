name: PHP CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode repositori
        uses: actions/checkout@v4

      - name: Siapkan PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Periksa sintaks seluruh berkas PHP
        run: find src -name "*.php" -print0 | xargs -0 -n1 php -l
